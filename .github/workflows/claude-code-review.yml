name: Claude Code Review

# Reviews every new and updated pull request.
#
# This is advisory and deliberately not part of the `all-checks-passed` gate:
# a review comment is not a pass/fail signal, and the repository already has
# CodeQL, dependency review, and the full test matrix for that.

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    # A pull_request event from a fork runs without repository secrets, so the
    # review could not authenticate. Skipping keeps fork contributors from
    # seeing a failure they have no way to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A Sonnet review of a 51-file pull request took eight minutes. Opus reads
    # more before it concludes, so the previous 20-minute ceiling was close
    # enough to cut a large review off mid-way.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check out the pull request
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review the pull request
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in
            the working directory.

            Focus on, in this order:
            - correctness: bugs, unhandled failures, race conditions, resource
              leaks (browser contexts, pages, listeners, timers);
            - security: secrets, tokens, saved browser state, page contents, or
              filesystem paths reaching logs or MCP results;
            - the contracts in AGENTS.md and docs/SPEC.md: explicit sessionId
              and pageId addressing, no global current session or page, domain
              and runtime code free of Playwright and MCP imports, per-session
              serialization with cross-session parallelism;
            - test coverage for the behaviour the change introduces.

            Report only what you can point at in the diff. Do not report style
            preferences, formatting, or naming taste. If the change is sound,
            say so briefly rather than inventing findings.

            Use `gh pr comment` for overall feedback and
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific lines. Post GitHub comments only;
            do not return the review as a message.
          # Pinned for the same reason the action SHAs are: an unpinned model
          # resolves to whatever the CLI currently defaults to, so review depth
          # would change under this repository without anything in it changing.
          # Opus earns its cost here because most real defects in this codebase
          # are cross-layer — a contract stated in the domain, enforced in the
          # runtime, and violated in an adapter — and those are invisible to a
          # reviewer reading one file at a time.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Report missing credentials
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; this pull request was not reviewed."
          echo "Add it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_STEP_SUMMARY"
