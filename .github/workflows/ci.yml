name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
      - name: Explain non-PR run
        if: github.event_name != 'pull_request'
        run: echo "Dependency diff review applies to pull requests; protected PRs already passed it."

  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  unit-and-build:
    name: unit-and-build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests
        run: npm test
      - name: Build package
        run: npm run build

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium and MCP integration tests
        run: xvfb-run --auto-servernum npm run test:integration
      - name: Run external-client e2e tests
        run: xvfb-run --auto-servernum npm run test:e2e

  stress:
    name: stress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run bounded concurrency stress tests
        run: xvfb-run --auto-servernum npm run test:stress

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Enforce coverage thresholds
        run: xvfb-run --auto-servernum npm run test:coverage

  package-smoke:
    name: package-smoke
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24
          - os: windows-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Verify installed npm tarball on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run verify:package
      - name: Verify installed npm tarball on Windows
        if: runner.os == 'Windows'
        run: npm run verify:package

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    needs:
      - dependency-review
      - static-checks
      - unit-and-build
      - browser-tests
      - stress
      - coverage
      - package-smoke
    steps:
      - name: Check all jobs passed
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          UNIT_AND_BUILD: ${{ needs.unit-and-build.result }}
          BROWSER_TESTS: ${{ needs.browser-tests.result }}
          STRESS: ${{ needs.stress.result }}
          COVERAGE: ${{ needs.coverage.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
        run: |
          for result in "$DEPENDENCY_REVIEW" "$STATIC_CHECKS" "$UNIT_AND_BUILD" "$BROWSER_TESTS" "$STRESS" "$COVERAGE" "$PACKAGE_SMOKE"; do
            if [ "$result" != "success" ]; then
              echo "One or more required checks failed."
              exit 1
            fi
          done
          echo "All checks passed."
