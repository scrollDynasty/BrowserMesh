name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag commit belongs to master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full verification
        run: xvfb-run --auto-servernum npm run verify
      - name: Verify installed npm tarball
        run: xvfb-run --auto-servernum npm run verify:package
      - name: Verify version matches tag and select npm dist-tag
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PACKAGE_VERSION"
          echo "git tag:      $TAG_VERSION"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "npm-tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm: $NPM_VERSION"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error('npm 11.5.1 or newer is required for trusted publishing'); process.exit(1); }" "$NPM_VERSION"
      - name: Publish to npm with OIDC
        run: npm publish --access public --tag "${{ steps.version.outputs.npm-tag }}"
      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help
      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
      - name: Write release summary
        run: |
          echo "## Published release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: multi-agent-browser-mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dist-tag: ${{ steps.version.outputs.npm-tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/multi-agent-browser-mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP Registry: https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.scrollDynasty/browsermesh" >> "$GITHUB_STEP_SUMMARY"
