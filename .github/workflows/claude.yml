name: Claude Code

# Answers @claude mentions in issue comments, PR comments, and PR reviews.
#
# The token is read into an environment variable at job level so the step can
# skip cleanly when it is absent. `secrets` is not available in a job-level
# `if`, and without this guard every mention in a repository that has not been
# configured yet would fail red instead of simply not answering.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: claude
    # Cheap pre-filter. The action detects the trigger phrase itself, but
    # checking here avoids starting a runner for every comment in the repo.
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check out the repository
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mentions are usually a short question about one thing, where an
          # answer that arrives quickly is worth more than a deeper one that
          # does not. Ask for the review workflow's depth by pointing Claude at
          # a specific concern rather than by changing this default.
          claude_args: --model claude-sonnet-5

      - name: Report missing credentials
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; the @claude mention was not answered."
          echo "Add it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_STEP_SUMMARY"
