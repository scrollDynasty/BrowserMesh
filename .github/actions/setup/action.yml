name: Setup BrowserMesh
description: Set up Node.js and install locked dependencies

inputs:
  node-version:
    description: Node.js major or version file value
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js from requested version
      if: inputs.node-version != ''
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Setup Node.js from .nvmrc
      if: inputs.node-version == ''
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash
